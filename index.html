<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        #flashcard-container {
            text-align: center;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 320px;
        }
        #phrase {
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 14px;
            margin: 5px 3px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            font-size: 14px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body>

<div id="flashcard-container">
    <div id="phrase">Loading...</div>
    <div class="button-group">
        <button id="flip-button" disabled>Flip</button>
        <button id="next-button" disabled>Next</button>
        <button id="toggle-button" disabled>Toggle Language</button>
        <button id="randomize-button" disabled>Randomize Phrases</button>
        <button id="restore-button" disabled>Restore Original</button>
    </div>
</div>

<script>
    let phrases = [];
    let originalPhrases = [];
    let currentPhraseIndex = 0;
    let showSpanishFirst = true;
    let isFlipped = false;

    // Load data from backend (adjust URL if needed)
    function loadPhrases() {
        fetch("https://flashcards-stlt.onrender.com/get_phrases") // replace with your actual Render backend URL
            .then(response => response.json())
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    phrases = [...data];
                    originalPhrases = [...data]; // backup
                    updateFlashcard();
                    enableButtons();
                } else {
                    document.getElementById("phrase").innerText = "No data found.";
                }
            })
            .catch(error => {
                document.getElementById("phrase").innerText = "Error loading data.";
                console.error('Error:', error);
            });
    }

    function updateFlashcard() {
        const phraseElement = document.getElementById("phrase");
        const currentPhrase = phrases[currentPhraseIndex];

        if (isFlipped) {
            phraseElement.innerText = showSpanishFirst ? currentPhrase.english : currentPhrase.spanish;
        } else {
            phraseElement.innerText = showSpanishFirst ? currentPhrase.spanish : currentPhrase.english;
        }
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function enableButtons() {
        document.getElementById("flip-button").disabled = false;
        document.getElementById("next-button").disabled = false;
        document.getElementById("toggle-button").disabled = false;
        document.getElementById("randomize-button").disabled = false;
        document.getElementById("restore-button").disabled = false;
    }

    // Button Handlers
    document.getElementById("flip-button").addEventListener("click", () => {
        isFlipped = !isFlipped;
        updateFlashcard();
    });

    document.getElementById("next-button").addEventListener("click", () => {
        currentPhraseIndex = (currentPhraseIndex + 1) % phrases.length;
        isFlipped = false;
        updateFlashcard();
    });

    document.getElementById("toggle-button").addEventListener("click", () => {
        showSpanishFirst = !showSpanishFirst;
        isFlipped = false;
        updateFlashcard();
    });

    document.getElementById("randomize-button").addEventListener("click", () => {
        shuffle(phrases);
        currentPhraseIndex = 0;
        isFlipped = false;
        updateFlashcard();
    });

    document.getElementById("restore-button").addEventListener("click", () => {
        phrases = [...originalPhrases];
        currentPhraseIndex = 0;
        isFlipped = false;
        updateFlashcard();
    });

    // Load on start
    loadPhrases();
</script>

</body>
</html>
