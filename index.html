<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spanish-English Flashcards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    #container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }

    #phrase {
      font-size: 24px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
    }

    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<div id="container">
  <div id="phrase">Loading...</div>
  <button id="flip">Flip</button>
  <button id="next">Next</button>
  <button id="toggle">Toggle Language</button>
</div>

<script>
  let phrases = [];
  let index = 0;
  let isFlipped = false;
  let showSpanishFirst = true;

  const phraseElement = document.getElementById("phrase");
  const flipBtn = document.getElementById("flip");
  const nextBtn = document.getElementById("next");
  const toggleBtn = document.getElementById("toggle");

  async function loadPhrases() {
    try {
      const res = await fetch("https://seniors-meds-2.onrender.com/ask-openai/get_phrases"); // Replace with your Render URL
      phrases = await res.json();

      if (!Array.isArray(phrases) || phrases.length === 0) {
        phraseElement.textContent = "No phrases found.";
        return;
      }

      shuffle(phrases);
      showCurrentPhrase();
    } catch (err) {
      phraseElement.textContent = "Error loading phrases.";
      console.error(err);
    }
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function showCurrentPhrase() {
    const phrase = phrases[index];
    phraseElement.textContent = showSpanishFirst ? phrase.spanish : phrase.english;
  }

  flipBtn.addEventListener("click", () => {
    const phrase = phrases[index];
    phraseElement.textContent = isFlipped
      ? (showSpanishFirst ? phrase.spanish : phrase.english)
      : (showSpanishFirst ? phrase.english : phrase.spanish);
    isFlipped = !isFlipped;
  });

  nextBtn.addEventListener("click", () => {
    index = (index + 1) % phrases.length;
    isFlipped = false;
    showCurrentPhrase();
  });

  toggleBtn.addEventListener("click", () => {
    showSpanishFirst = !showSpanishFirst;
    isFlipped = false;
    showCurrentPhrase();
  });

  loadPhrases();
</script>

</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        #flashcard-container {
            text-align: center;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 300px;
        }
        #phrase {
            font-size: 24px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div id="flashcard-container">
    <div id="phrase">Loading...</div>
    <button id="flip-button" disabled>Flip</button>
    <button id="next-button" disabled>Next</button>
    <button id="toggle-button" disabled>Toggle Language</button>
</div>

<script>
    let phrases = [];
    let currentPhraseIndex = 0;
    let showSpanishFirst = true;
    let isFlipped = false;

    const API_KEY = 'd8fe1ecd35341a5cfae2549e4f1bb6036cab6501';

    const SPREADSHEET_ID = '1vkouidyZnfjWrjlggChvFmfyeKgbBMvX07zzlrxzjng';
    const RANGE = 'Sheet1!A:B';

    // Load data from Google Sheets
    function loadPhrases() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${RANGE}?key=${API_KEY}`;
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                
                const rows = data.values;
                console.log("in fetch.");
                if (rows && rows.length > 0) {
                    rows.forEach(row => {
                        phrases.push({"spanish": row[0], "english": row[1]});
                    });
                    shuffle(phrases);
                    updateFlashcard();
                    enableButtons();
                } else {
                    document.getElementById("phrase").innerText = "No data found.";
                }
            })
            .catch(error => {
                document.getElementById("phrase").innerText = "Error loading data.";
                console.error('Error loading data from Google Sheets:', error);
            });
    }

    // Shuffle the phrases array
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // Update the flashcard content
    function updateFlashcard() {
        const phraseElement = document.getElementById("phrase");
        const currentPhrase = phrases[currentPhraseIndex];

        if (isFlipped) {
            phraseElement.innerText = showSpanishFirst ? currentPhrase.english : currentPhrase.spanish;
        } else {
            phraseElement.innerText = showSpanishFirst ? currentPhrase.spanish : currentPhrase.english;
        }
    }

    // Enable buttons after data is loaded
    function enableButtons() {
        document.getElementById("flip-button").disabled = false;
        document.getElementById("next-button").disabled = false;
        document.getElementById("toggle-button").disabled = false;
    }

    // Handle flipping the flashcard
    document.getElementById("flip-button").addEventListener("click", function () {
        isFlipped = !isFlipped;
        updateFlashcard();
    });

    // Handle showing the next flashcard
    document.getElementById("next-button").addEventListener("click", function () {
        currentPhraseIndex = (currentPhraseIndex + 1) % phrases.length;
        isFlipped = false;
        updateFlashcard();
    });

    // Handle toggling the language display
    document.getElementById("toggle-button").addEventListener("click", function () {
        showSpanishFirst = !showSpanishFirst;
        isFlipped = false;
        updateFlashcard();
    });

    // Start the app by loading phrases from Google Sheets
    loadPhrases();
</script>

</body>
</html>
