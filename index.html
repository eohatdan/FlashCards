<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spanish Flashcards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #app {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 360px;
    }
    #card {
      font-size: 20px;
      margin-bottom: 20px;
    }
    button, input, textarea {
      margin: 5px;
      padding: 10px;
      font-size: 14px;
      border-radius: 5px;
    }
    button {
      border: none;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    textarea {
      width: 90%;
      height: 40px;
    }
    input[type="number"], input[readonly] {
      width: 60px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <div id="app">
    <div id="card">Loading...</div>
    <button onclick="flipCard()">Flip</button>
    <button onclick="nextCard()">Next</button>
    <button onclick="toggleLanguage()">Toggle Language</button>
    <button onclick="randomizePhrases()">Randomize Phrases</button>

    <hr />
    <h4>Edit Current Phrase</h4>
    <textarea id="edit-spanish" placeholder="Edit Spanish"></textarea><br />
    <textarea id="edit-english" placeholder="Edit English"></textarea><br />
    <button onclick="savePhrase()">Save</button>
    <button onclick="deletePhrase()">Delete</button>
    <br />
    <label>Row ID: <input type="number" id="row-id" readonly /></label>

    <h4>Add New Phrase</h4>
    <textarea id="new-spanish" placeholder="New Spanish"></textarea><br />
    <textarea id="new-english" placeholder="New English"></textarea><br />
    <button onclick="addPhrase()">Add</button>

    <h4>Set Start Row</h4>
    <input type="number" id="start-row" min="0" value="0" />
    <button onclick="loadPhrases()">Load From Row</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://ixxzxenspwzrkiazepbj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4eHp4ZW5zcHd6cmtpYXplcGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM1MzE1NjMsImV4cCI6MjA1OTEwNzU2M30.28E41uParU4YMisV-Kxlq1KybbOdRrbKqXYKrH84COw';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let phrases = [];
    let currentIndex = 0;
    let showSpanish = true;
    let isFlipped = false;

    async function loadPhrases() {
      const startRow = parseInt(document.getElementById('start-row').value) || 0;
      const { data, error } = await client.from('Spanish_phrases').select('id, Spanish, English');
      if (error || !data) {
        document.getElementById('card').innerText = 'Failed to load phrases';
        return;
      }
      phrases = data.slice(startRow);
      currentIndex = 0;
      displayCard();
    }

    function displayCard() {
      if (phrases.length === 0) return;
      const card = document.getElementById('card');
      const phrase = phrases[currentIndex];
      document.getElementById('edit-spanish').value = phrase.Spanish;
      document.getElementById('edit-english').value = phrase.English;
      document.getElementById('row-id').value = phrase.id;
      card.innerText = isFlipped
        ? (showSpanish ? phrase.English : phrase.Spanish)
        : (showSpanish ? phrase.Spanish : phrase.English);
    }

    function flipCard() {
      isFlipped = !isFlipped;
      displayCard();
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % phrases.length;
      isFlipped = false;
      displayCard();
    }

    function toggleLanguage() {
      showSpanish = !showSpanish;
      isFlipped = false;
      displayCard();
    }

    function randomizePhrases() {
      for (let i = phrases.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [phrases[i], phrases[j]] = [phrases[j], phrases[i]];
      }
      currentIndex = 0;
      isFlipped = false;
      displayCard();
    }

    async function savePhrase() {
      const spanish = document.getElementById('edit-spanish').value;
      const english = document.getElementById('edit-english').value;
      const id = phrases[currentIndex].id;
      const { error } = await client.from('Spanish_phrases').update({ Spanish: spanish, English: english }).eq('id', id);
      if (!error) {
        phrases[currentIndex].Spanish = spanish;
        phrases[currentIndex].English = english;
        displayCard();
      }
    }

    async function deletePhrase() {
      const id = phrases[currentIndex].id;
      const { error } = await client.from('Spanish_phrases').delete().eq('id', id);
      if (!error) {
        phrases.splice(currentIndex, 1);
        currentIndex = Math.min(currentIndex, phrases.length - 1);
        displayCard();
      }
    }

    async function addPhrase() {
      const spanish = document.getElementById('new-spanish').value;
      const english = document.getElementById('new-english').value;
      const { data, error } = await client.from('Spanish_phrases').insert([{ Spanish: spanish, English: english }]);
      if (!error) {
        phrases.push(data[0]);
        document.getElementById('new-spanish').value = '';
        document.getElementById('new-english').value = '';
        alert('Phrase added');
      }
    }

    loadPhrases();
  </script>
</body>
</html>
