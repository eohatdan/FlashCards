<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spanish Flashcards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    #app {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 320px;
    }
    #card {
      font-size: 24px;
      margin-bottom: 20px;
    }
    button {
      margin: 5px;
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
  <div id="app">
    <div id="card">Loading...</div>
    <button onclick="flipCard()">Flip</button>
    <button onclick="nextCard()">Next</button>
    <button onclick="toggleLanguage()">Toggle Language</button>
    <button onclick="randomizePhrases()">Randomize Phrases</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://ixxzxenspwzrkiazepbj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4eHp4ZW5zcHd6cmtpYXplcGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM1MzE1NjMsImV4cCI6MjA1OTEwNzU2M30.28E41uParU4YMisV-Kxlq1KybbOdRrbKqXYKrH84COw';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let phrases = [];
    let currentIndex = 0;
    let showSpanish = true;
    let isFlipped = false;

    async function loadPhrases() {
      const { data, error } = await client.from('Spanish_phrases').select('Spanish, English');
      if (error || !data) {
        document.getElementById('card').innerText = 'Failed to load phrases';
        return;
      }
      phrases = data;
      displayCard();
    }

    function displayCard() {
      const card = document.getElementById('card');
      const phrase = phrases[currentIndex];
      card.innerText = isFlipped
        ? (showSpanish ? phrase.English : phrase.Spanish)
        : (showSpanish ? phrase.Spanish : phrase.English);
    }

    function flipCard() {
      isFlipped = !isFlipped;
      displayCard();
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % phrases.length;
      isFlipped = false;
      displayCard();
    }

    function toggleLanguage() {
      showSpanish = !showSpanish;
      isFlipped = false;
      displayCard();
    }

    function randomizePhrases() {
      for (let i = phrases.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [phrases[i], phrases[j]] = [phrases[j], phrases[i]];
      }
      currentIndex = 0;
      isFlipped = false;
      displayCard();
    }

    loadPhrases();
  </script>
</body>
</html>
